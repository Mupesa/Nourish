<html class="light" lang="en"><head>

                        "surface-dim": "#d6dcd3",
                        "inverse-on-surface": "#edf2e9",

                    "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .choice-card-active {
            border-color: #436444 !important;
            background-color: #f7fff2 !important;
            border-width: 2px !important;
        }
        body {
            background-color: #f5fbf2; /* Matches background token */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen font-body-md text-on-surface">
<!-- Top Navigation Header -->
<header class="fixed top-0 w-full z-40 bg-background flex items-center justify-between px-gutter h-16 max-w-container-max mx-auto left-0 right-0">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-display-lg-mobile text-display-lg-mobile text-primary">Nourish</span>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-gutter w-full max-w-container-max mx-auto flex flex-col items-center">
<!-- Progress Indicator -->
<div class="w-full flex justify-center gap-xs mb-xl">
<div class="h-1.5 w-12 rounded-full border border-primary"></div>
<div class="h-1.5 w-12 rounded-full border border-primary"></div>
<div class="h-1.5 w-12 rounded-full border border-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-surface-variant"></div>
</div>
<!-- Headline & Friendly Tone -->
<div class="text-center mb-md">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">How active are you?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                This helps us get your calorie target just right.
            </p>
</div>
<!-- Choice Chips (Bento Style Cards) -->
<div class="grid grid-cols-1 gap-sm w-full">
<!-- Option 1 -->
<button class="group flex items-center p-md bg-white border border-outline-variant rounded-xl text-left transition-all hover:bg-surface-container-low active:scale-[0.98] duration-200" onclick="selectActivity(this)">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="event_seat">event_seat</span>
</div>
<div>
<h3 class="font-button-text text-button-text text-on-surface">Sedentary</h3>
<p class="text-body-md text-on-surface-variant opacity-70">Office job, very little exercise</p>
</div>
</button>
<!-- Option 2 -->
<button class="group flex items-center p-md bg-white border border-outline-variant rounded-xl text-left transition-all hover:bg-surface-container-low active:scale-[0.98] duration-200" onclick="selectActivity(this)">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="directions_walk">directions_walk</span>
</div>
<div>
<h3 class="font-button-text text-button-text text-on-surface">Lightly Active</h3>
<p class="text-body-md text-on-surface-variant opacity-70">Daily walks, light chores</p>
</div>
</button>
<!-- Option 3 -->
<button class="group flex items-center p-md bg-white border border-outline-variant rounded-xl text-left transition-all hover:bg-surface-container-low active:scale-[0.98] duration-200" onclick="selectActivity(this)">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="fitness_center">fitness_center</span>
</div>
<div>
<h3 class="font-button-text text-button-text text-on-surface">Moderately Active</h3>
<p class="text-body-md text-on-surface-variant opacity-70">Gym 3-4x weekly, active hobbies</p>
</div>
</button>
<!-- Option 4 -->
<button class="group flex items-center p-md bg-white border border-outline-variant rounded-xl text-left transition-all hover:bg-surface-container-low active:scale-[0.98] duration-200" onclick="selectActivity(this)">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mr-md group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="exercise">exercise</span>
</div>
<div>
<h3 class="font-button-text text-button-text text-on-surface">Very Active</h3>
<p class="text-body-md text-on-surface-variant opacity-70">Physical job or high-intensity training daily</p>
</div>
</button>
</div>
<!-- Illustrative Element (Atmospheric Animation) -->
<div class="mt-lg relative w-full h-48 rounded-xl overflow-hidden shadow-sm border border-outline-variant">

<div class="absolute inset-0 bg-gradient-to-t from-background/40 to-transparent flex items-end p-md">
<p class="font-label-caps text-label-caps text-on-surface-variant">Finding your flow...</p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Shell) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-lg py-md bg-surface border-t border-outline-variant shadow-sm">
<!-- Back Action -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-98 duration-200">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
<span class="font-button-text text-button-text">Back</span>
</button>
<!-- Next Action (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-8 py-3 shadow-md hover:bg-primary transition-colors active:scale-95 duration-150">
<div class="flex items-center gap-xs">
<span class="font-button-text text-button-text">Next</span>
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</nav>
<!-- Footer -->
<footer class="w-full mt-auto flex flex-col items-center gap-sm py-lg max-w-container-max mx-auto px-gutter">
<p class="font-label-caps text-label-caps text-secondary">© 2024 Nourish. Supportive Kitchen Friend.</p>
<div class="flex gap-md">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Skip for now</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>
<script>
        function selectActivity(element) {
            // Remove active classes from all siblings
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('choice-card-active');
                btn.querySelector('div').classList.remove('bg-primary-fixed-dim');
                btn.querySelector('div').classList.add('bg-surface-container');
            });

            // Add active classes to selected
            element.classList.add('choice-card-active');
            const iconContainer = element.querySelector('div');
            iconContainer.classList.remove('bg-surface-container');
            iconContainer.classList.add('bg-primary-fixed-dim');

            // Success feedback (simulated micro-interaction)
            console.log('Activity level selected:', element.querySelector('h3').innerText);
        }
    </script>
</body></html>
