<!-- Interactive Logic -->
<script>
        // Simple Draggable implementation for the calorie tag
        const dragElement = document.getElementById('calorieTag');
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        dragElement.onmousedown = dragMouseDown;
        dragElement.ontouchstart = dragMouseDown;

        function dragMouseDown(e) {
            e = e || window.event;
            // Prevent scrolling on mobile while dragging
            if (e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
            }
            document.onmouseup = closeDragElement;
            document.ontouchend = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            let clientX, clientY;
            
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                e.preventDefault();
                clientX = e.clientX;
                clientY = e.clientY;
            }

            pos1 = pos3 - clientX;
            pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;

            // Set the element's new position
            let newTop = dragElement.offsetTop - pos2;
            let newLeft = dragElement.offsetLeft - pos1;

            // Constraints to keep tag within the view area above the sheet
            const sheetTop = document.querySelector('.glass-sheet').offsetTop;
            if (newTop > 80 && newTop < sheetTop - 60) {
                dragElement.style.top = newTop + "px";
            }
            if (newLeft > 20 && newLeft < window.innerWidth - 120) {
                dragElement.style.left = newLeft + "px";
            }
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }

        // Haptic-like feedback on checkboxes
        document.querySelectorAll('.friend-checkbox').forEach(cb => {
            cb.addEventListener('change', () => {
                cb.parentElement.classList.toggle('bg-primary-fixed', cb.checked);
                cb.parentElement.classList.toggle('bg-surface-container', !cb.checked);
            });
        });
    </script>
