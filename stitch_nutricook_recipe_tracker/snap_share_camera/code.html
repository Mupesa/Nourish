<style>

<body class="bg-black overflow-hidden selection:bg-primary-container h-screen w-screen flex flex-col font-body-md text-on-surface">

<main class="relative flex-1 w-full h-full flex flex-col overflow-hidden">
<!-- Viewfinder Feed (Simulated with Background Image) -->

</div>
<!-- Interface Overlays -->
<div class="relative z-10 flex flex-col h-full w-full fade-overlay pointer-events-none">
<!-- Top Bar: Navigation & Close -->
<nav class="flex items-center justify-between px-container-margin py-lg pointer-events-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-black/20 backdrop-blur-md text-white hover:bg-black/40 transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-black/20 backdrop-blur-md text-white hover:bg-black/40 transition-colors">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</nav>
<!-- Center Prompt -->
<div class="flex-1 flex flex-col items-center justify-center">
<div class="px-md py-xs rounded-full bg-black/30 backdrop-blur-lg border border-white/10" id="capture-prompt">
<p class="font-label-md text-label-md text-white tracking-wide">Snap a photo of your meal</p>
</div>
</div>
<!-- Bottom Controls -->
<footer class="flex flex-col items-center gap-lg pb-xl px-container-margin pointer-events-auto" id="camera-controls">
<div class="flex items-center justify-between w-full max-w-sm px-md">
<!-- Gallery/Roll Shortcut -->
<div class="w-12 h-12 rounded-xl overflow-hidden border-2 border-white/20 bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A thumbnail preview of a fresh kale and pomegranate salad with citrus dressing. The image is bright and airy with a modern organic feel, emphasizing healthy ingredients and natural textures consistent with the Nourish brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAF5B54Ox7IkTGLjM5paGfKqdyIW0zKVaXp3ys8fSXNd6k_UDGEorLXZ5IdLDac_zn-6lsXJg9cWdBMqgGjh7biL0kADF7aXWtC60DpYqusVHLpGv2Wufx89hjWU0Nnh0D5PQFbQo0dxx1oIacD7hWkXlIE29vszngBI9wzdzQHxfPc84DdTgkPui7rOfOlwidFbhJ15dimZkrL99yRClHZh9jFLzvG_dK7X0L9vpWWpFBLTBrsH43JAfsOs_ImTn7WHMtSn1z9H64u"/>

<!-- Shutter Button -->

<span class="material-symbols-outlined" style="font-size: 28px;">flip_camera_ios</span>

</div>

</div>

</div>

</button>
</div>

            Retake
          </button>

</main>
<script>
    function takePhoto() {
      // Simulate flash effect
      const flash = document.createElement('div');
      flash.className = 'fixed inset-0 bg-white z-[100] animate-pulse';
      document.body.appendChild(flash);
      
      // Simulate Camera Shutter Sound & Action
      setTimeout(() => {
        flash.remove();
        
        // Hide camera UI
        document.getElementById('camera-controls').classList.add('opacity-0');
        document.getElementById('capture-prompt').classList.add('opacity-0');
        
        // Show Post-Capture Layer
        const postLayer = document.getElementById('post-capture-layer');
        postLayer.classList.remove('hidden');
        postLayer.classList.add('opacity-100');
        
        // Scale viewfinder slightly to show it's a "still"
        document.getElementById('camera-feed').classList.add('scale-[1.02]');
      }, 100);
    }

    function resetCamera() {
      const postLayer = document.getElementById('post-capture-layer');
      postLayer.classList.add('hidden');
      
      document.getElementById('camera-controls').classList.remove('opacity-0');
      document.getElementById('capture-prompt').classList.remove('opacity-0');
      document.getElementById('camera-feed').classList.remove('scale-[1.02]');
    }

    // Atmospheric micro-interaction: subtle floating for the prompt
    const prompt = document.getElementById('capture-prompt');
    let angle = 0;
    function animatePrompt() {
      angle += 0.05;
      const y = Math.sin(angle) * 5;
      prompt.style.transform = `translateY(${y}px)`;
      requestAnimationFrame(animatePrompt);
    }
    animatePrompt();
  </script>
