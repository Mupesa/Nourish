<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.querySelector('[data-alt]');
            // Subtle parallax or zoom on load
            setTimeout(() => {
                hero.style.transform = 'scale(1.05)';
                hero.style.transition = 'transform 20s linear';
            }, 100);
        });

        // Handle Active states from JSON logic
        const buttons = document.querySelectorAll('button, a');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-98', 'duration-200'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-98'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-98'));
        });
    </script>
