<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            transition: font-variation-settings 0.3s ease;
        }
        .option-card:hover .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .option-card.active {
            border-width: 2px;
            border-color: #436444; /* primary */
            background-color: #f7fff2; /* on-primary-container-tintish */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top AppBar (Identity & Navigation) -->
<header class="fixed top-0 w-full z-50 h-16 bg-background">
<div class="flex items-center justify-between px-gutter w-full max-w-container-max mx-auto h-full">
<div class="flex items-center gap-base">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-150 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Nourish</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-gutter pt-24 pb-32 flex flex-col items-center">
<!-- Progress Indicator -->
<div class="w-full flex gap-2 mb-xl">
<div class="h-2 flex-grow rounded-full border border-primary bg-transparent"></div>
<div class="h-2 flex-grow rounded-full bg-primary"></div>
<div class="h-2 flex-grow rounded-full bg-surface-container-highest"></div>
<div class="h-2 flex-grow rounded-full bg-surface-container-highest"></div>
</div>
<!-- Headline Section -->
<section class="text-center mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">What's your main goal?</h2>
<p class="font-body-md text-on-surface-variant">We'll tailor your kitchen journey based on your priority.</p>
</section>
<!-- Goal Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full">
<!-- Option 1: Lose Weight -->
<button class="option-card group flex flex-col items-start p-md bg-surface-container-lowest border border-outline-variant rounded-xl text-left hover:border-primary transition-all active:scale-98 duration-200" onclick="selectGoal(this)">
<div class="mb-sm bg-primary-fixed text-on-primary-fixed p-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="scale">scale</span>
</div>
<h3 class="font-button-text text-button-text text-on-surface mb-xs">Lose Weight</h3>
<p class="text-on-surface-variant text-sm">A balanced deficit with nutrient-dense meals.</p>
</button>
<!-- Option 2: Maintain & Tone -->
<button class="option-card group flex flex-col items-start p-md bg-surface-container-lowest border border-outline-variant rounded-xl text-left hover:border-primary transition-all active:scale-98 duration-200" onclick="selectGoal(this)">
<div class="mb-sm bg-primary-fixed text-on-primary-fixed p-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="spa">spa</span>
</div>
<h3 class="font-button-text text-button-text text-on-surface mb-xs">Maintain & Tone</h3>
<p class="text-on-surface-variant text-sm">Focus on long-term wellness and energy stability.</p>
</button>
<!-- Option 3: Gain Muscle -->
<button class="option-card group flex flex-col items-start p-md bg-surface-container-lowest border border-outline-variant rounded-xl text-left hover:border-primary transition-all active:scale-98 duration-200" onclick="selectGoal(this)">
<div class="mb-sm bg-primary-fixed text-on-primary-fixed p-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</div>
<h3 class="font-button-text text-button-text text-on-surface mb-xs">Gain Muscle</h3>
<p class="text-on-surface-variant text-sm">Strength-focused meals with a healthy surplus.</p>
</button>
<!-- Option 4: Healthy Habits -->
<button class="option-card group flex flex-col items-start p-md bg-surface-container-lowest border border-outline-variant rounded-xl text-left hover:border-primary transition-all active:scale-98 duration-200" onclick="selectGoal(this)">
<div class="mb-sm bg-primary-fixed text-on-primary-fixed p-sm rounded-lg">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
</div>
<h3 class="font-button-text text-button-text text-on-surface mb-xs">Healthy Habits</h3>
<p class="text-on-surface-variant text-sm">Master better cooking and diverse ingredients.</p>
</button>
</div>
<!-- Decorative Element (Organic feel) -->
<div class="mt-xl opacity-20 pointer-events-none select-none">
<img class="w-48 h-48 mix-blend-multiply" data-alt="A soft, blurred watercolor painting of abstract organic leaf shapes in sage green and earthy terracotta tones, creating a calm and nurturing atmosphere for a wellness brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrVP8SpRDPjaEYCsiCGx2ls3BYqqSXRy9ofFEli-l56yjPyCyDgJsjlEBsV2_yBp0cadJKvmeBz2o8GFVJBhSV50FGykeSa5AaKmDi-w5JPWH_h5WAyUWbXM5y-r9ZED2xRfSxlOxq7FKmRkJCntmgXfI-sAv2zzVusqaEL8j6Ga3JJ4mkjYIwYte_uA5YSkrTWIZsS08SNEjVncAYqJP4TzEqnuzOWrBZ0-7hSl2dgLb1DEHPumEghLDkIKiyC6iTBUstxgJV5uH1"/>
</div>
</main>
<!-- Bottom Navigation Bar (Actions) -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-outline-variant shadow-sm flex justify-between items-center px-lg py-md rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary-fixed-dim transition-colors px-6 py-2 rounded-full active:scale-98 duration-200">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
<span class="font-button-text text-button-text">Back</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-8 py-2 hover:opacity-80 transition-all active:scale-98 duration-200 shadow-sm">
<span class="font-button-text text-button-text flex items-center gap-xs">
                Next
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</span>
</button>
</nav>
<!-- Footer (Legal/Support) -->
<footer class="w-full mt-auto flex flex-col items-center gap-sm py-lg max-w-container-max mx-auto bg-transparent">
<p class="font-label-caps text-label-caps text-secondary text-center px-gutter">
            © 2024 Nourish. Supportive Kitchen Friend.
        </p>
<div class="flex gap-md">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Skip for now</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>
<script>
        function selectGoal(element) {
            // Remove active class from all
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('active');
                card.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
            });
            // Add active class to selected
            element.classList.add('active');
            element.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            
            // Micro-interaction: Subtle bounce on select
            element.classList.add('scale-95');
            setTimeout(() => {
                element.classList.remove('scale-95');
            }, 100);
        }
    </script>
</body></html>
