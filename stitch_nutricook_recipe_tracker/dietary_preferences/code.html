        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background h-16 flex items-center justify-between px-gutter max-w-container-max mx-auto left-0 right-0">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Nourish</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-container-max mx-auto px-gutter pt-24 pb-32 flex flex-col items-center">
<!-- Progress Indicator -->
<div class="w-full flex items-center justify-center gap-xs mb-xl">
<div class="h-1.5 w-12 rounded-full border border-primary bg-transparent"></div>
<div class="h-1.5 w-12 rounded-full border border-primary bg-transparent"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-12 rounded-full bg-tertiary-fixed"></div>
</div>
<!-- Headline & Copy -->
<div class="text-center mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">Any dietary preferences?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">We'll tailor your recipes to match.</p>
</div>
<!-- Dietary Choice Chips / Bento Grid Style -->
<div class="grid grid-cols-2 gap-sm w-full">
<!-- Vegetarian -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="leafy_green">dual_screen</span>
<span class="font-button-text text-button-text">Vegetarian</span>
</button>
<!-- Vegan -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="eco">eco</span>
<span class="font-button-text text-button-text">Vegan</span>
</button>
<!-- Keto -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="bolt">bolt</span>
<span class="font-button-text text-button-text">Keto</span>
</button>
<!-- Gluten-Free -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="no_meals">no_meals</span>
<span class="font-button-text text-button-text">Gluten-Free</span>
</button>
<!-- Mediterranean -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="waves">waves</span>
<span class="font-button-text text-button-text text-center">Mediterranean</span>
</button>
<!-- Paleo -->
<button class="choice-card group flex flex-col items-center justify-center p-lg rounded-xl border border-outline-variant bg-surface-container-lowest transition-all-custom hover:border-primary active:scale-98" onclick="toggleChoice(this)">
<span class="material-symbols-outlined text-primary text-4xl mb-base group-hover:scale-110 transition-transform" data-icon="outdoor_grill">outdoor_grill</span>
<span class="font-button-text text-button-text">Paleo</span>
</button>
</div>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-lg py-md bg-surface border-t border-outline-variant shadow-sm rounded-t-xl">
<!-- Back Button (Inactive state style) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary-fixed-dim transition-colors px-6 py-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
<span class="font-button-text text-button-text">Back</span>
</button>
<!-- Next Button (Active state style) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-10 py-2 hover:opacity-90 active:scale-98 transition-all duration-200 shadow-sm">

<button class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors">Skip for now</button>
<button class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors">Terms of Service</button>
</div>
<p class="font-label-caps text-label-caps text-secondary opacity-70">© 2024 Nourish. Supportive Kitchen Friend.</p>
</footer>
<script>
        function toggleChoice(element) {
            element.classList.toggle('choice-card-active');
            
            // Add a little haptic-like bounce on click
            element.style.transform = 'scale(0.95)';
            setTimeout(() => {
                element.style.transform = '';
            }, 100);

            // Access the material symbol within to toggle fill
            const icon = element.querySelector('.material-symbols-outlined');
            if (element.classList.contains('choice-card-active')) {
                icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        }
    </script>
